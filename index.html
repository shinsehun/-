<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘 날씨에 대한 옷 추천</title>
  <!-- Google Fonts & FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --primary-color: #2b5876;
      --accent-color: #ff6b6b;
      --text-dark: #2d3748;
      --text-muted: #718096;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      transition: background 0.8s ease;
      color: var(--text-dark);
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 35px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
      text-align: center;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }

    /* 추천 버튼 */
    .btn-recommend {
      width: 100%;
      padding: 18px 24px;
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #4e54c8, #8f94fb);
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(78, 84, 200, 0.3);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-recommend:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(78, 84, 200, 0.4);
    }

    .btn-recommend:active {
      transform: translateY(1px);
    }

    /* 결과 영역 */
    .result-container {
      margin-top: 30px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      display: none;
    }

    .result-container.show {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    /* 옷 추천 강조 섹션 */
    .outfit-card {
      background: #ffffff;
      padding: 25px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      margin-bottom: 24px;
      border: 2px solid rgba(78, 84, 200, 0.1);
    }

    .outfit-badge {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #4e54c8;
      background: rgba(78, 84, 200, 0.1);
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .outfit-title {
      font-size: 2.1rem;
      font-weight: 800;
      color: #1a202c;
      line-height: 1.3;
      margin-bottom: 10px;
      word-break: keep-all;
    }

    .outfit-desc {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.5;
      word-break: keep-all;
    }

    /* 날씨 정보 섹션 */
    .weather-card {
      background: rgba(255, 255, 255, 0.6);
      padding: 20px;
      border-radius: 18px;
      backdrop-filter: blur(5px);
    }

    .weather-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-bottom: 12px;
    }

    .weather-icon {
      font-size: 2.8rem;
    }

    .temp-display {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--text-dark);
    }

    .weather-status {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 12px;
    }

    .weather-details {
      display: flex;
      justify-content: space-around;
      border-top: 1px solid rgba(0, 0, 0, 0.08);
      padding-top: 12px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .weather-detail-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .weather-detail-item span:last-child {
      font-weight: 700;
      color: var(--text-dark);
    }

    /* 날씨 컨트롤 시뮬레이터 */
    .controls {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px dashed rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .control-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .temp-slider-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .temp-slider {
      flex: 1;
      height: 6px;
      border-radius: 5px;
      background: #ddd;
      outline: none;
      -webkit-appearance: none;
    }

    .temp-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #4e54c8;
      cursor: pointer;
    }

    .condition-select {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      outline: none;
      font-size: 0.9rem;
      background: white;
    }

    /* 애니메이션 효과 */
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    .pulse {
      animation: pulse 0.4s ease-in-out;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1><i class="fa-solid fa-shirt"></i> 오늘 날씨에 대한 옷 추천</h1>

    <!-- 추천 버튼 -->
    <button class="btn-recommend" id="recommendBtn">
      <i class="fa-solid fa-wand-magic-sparkles"></i> 오늘 옷 추천
    </button>

    <!-- 결과 표시 영역 -->
    <div class="result-container" id="resultArea">
      <!-- 1. 추천 옷 정보 (큰 글씨) -->
      <div class="outfit-card">
        <span class="outfit-badge" id="outfitBadge">오늘의 추천 룩</span>
        <div class="outfit-title" id="outfitTitle">반팔티 & 반바지</div>
        <div class="outfit-desc" id="outfitDesc">시원하고 가벼운 차림이 좋아요. 자외선 차단제와 선글라스를 챙겨주세요!</div>
      </div>

      <!-- 2. 오늘 날씨 정보 -->
      <div class="weather-card">
        <div class="weather-header">
          <i class="weather-icon fa-solid fa-sun" id="weatherIcon" style="color: #ffb703;"></i>
          <div class="temp-display"><span id="tempValue">28</span>°C</div>
        </div>
        <div class="weather-status" id="weatherStatus">맑음 (서울 기준)</div>
        <div class="weather-details">
          <div class="weather-detail-item">
            <span>체감 온도</span>
            <span id="feelsLike">29°C</span>
          </div>
          <div class="weather-detail-item">
            <span>습도</span>
            <span id="humidity">45%</span>
          </div>
          <div class="weather-detail-item">
            <span>풍속</span>
            <span id="wind">2.5m/s</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 테스트용 날씨 조절기 -->
    <div class="controls">
      <div class="control-label">⚙️ 날씨 조건 직접 설정해보기</div>
      <div class="temp-slider-group">
        <span style="font-size: 0.8rem; font-weight: bold;">-10°C</span>
        <input type="range" id="tempInput" class="temp-slider" min="-10" max="38" value="22">
        <span style="font-size: 0.8rem; font-weight: bold;">38°C</span>
      </div>
      <select id="conditionInput" class="condition-select">
        <option value="clear">☀️ 맑음</option>
        <option value="rain">🌧️ 비</option>
        <option value="snow">❄️ 눈</option>
        <option value="wind">💨 강풍</option>
      </select>
    </div>
  </div>

  <script>
    // 날씨 구간별 옷 추천 데이터베이스
    const outfitData = [
      {
        maxTemp: 4,
        badge: "한파 대비 룩",
        title: "패딩 & 두꺼운 코트 & 목도리",
        desc: "히트텍, 내복을 챙겨입으세요! 장갑과 목도리로 체온을 유지해야 합니다.",
        bg: "linear-gradient(135deg, #c1dfc4 0%, #deecdd 100%)"
      },
      {
        maxTemp: 8,
        badge: "겨울 스타일링",
        title: "울 코트 & 가죽 재킷 & 니트",
        desc: "두꺼운 가디건이나 코트 안에 따뜻한 니트를 레이어드해 입으세요.",
        bg: "linear-gradient(135deg, #e6e9f0 0%, #eef1f5 100%)"
      },
      {
        maxTemp: 11,
        badge: "쌀쌀한 날씨 룩",
        title: "트렌치코트 & 자켓 & 플리스",
        desc: "일교차가 큽니다. 여러 겹 레이어드해서 입는 것이 좋습니다.",
        bg: "linear-gradient(135deg, #accbee 0%, #e7f0fd 100%)"
      },
      {
        maxTemp: 16,
        badge: "간절기 베스트 룩",
        title: "자켓 & 가디건 & 야상 & 맨투맨",
        desc: "활동하기 딱 좋은 날씨입니다! 가벼운 아우터를 하나 챙기세요.",
        bg: "linear-gradient(135deg, #f3e7e9 0%, #e3eeff 100%)"
      },
      {
        maxTemp: 19,
        badge: "포근한 봄/가을 룩",
        title: "얇은 가디건 & 얇은 니트 & 셔츠",
        desc: "긴팔 셔츠나 얇은 가디건 하나면 충분히 따뜻하고 스타일리시합니다.",
        bg: "linear-gradient(135deg, #ffedd5 0%, #fed7aa 100%)"
      },
      {
        maxTemp: 22,
        badge: "선선한 날씨 룩",
        title: "긴팔 티셔츠 & 면바지 & 슬랙스",
        desc: "단품으로 입기 좋은 기온입니다. 얇은 긴팔이나 칠부 옷을 추천해요.",
        bg: "linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%)"
      },
      {
        maxTemp: 27,
        badge: "초여름 룩",
        title: "반팔티 & 얇은 셔츠 & 반바지",
        desc: "낮에는 조금 더울 수 있습니다. 통풍이 잘 되는 시원한 소재를 선택하세요.",
        bg: "linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%)"
      },
      {
        maxTemp: 99,
        badge: "폭염 대비 룩",
        title: "민소매 & 린넨 의류 & 반바지",
        desc: "무더운 날씨입니다! 린넨 소재의 시원한 옷과 자외선 차단 용품을 꼭 챙기세요.",
        bg: "linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)"
      }
    ];

    // 날씨 상태별 아이콘 및 텍스트 설정
    const conditionConfig = {
      clear: { icon: "fa-sun", color: "#ffb703", text: "맑음", extraDesc: "" },
      rain: { icon: "fa-cloud-showers-heavy", color: "#4a90e2", text: "비 옴", extraDesc: " ☔ 우산과 우비를 꼭 챙기세요!" },
      snow: { icon: "fa-snowflake", color: "#70d6ff", text: "눈 옴", extraDesc: " ❄️ 미끄러지지 않는 신발을 신으세요!" },
      wind: { icon: "fa-wind", color: "#a8ded6", text: "바람 강함", extraDesc: " 💨 바람을 막아줄 윈드브레이커(바람막이)를 추천합니다." }
    };

    // DOM 요소
    const recommendBtn = document.getElementById('recommendBtn');
    const resultArea = document.getElementById('resultArea');
    const outfitBadge = document.getElementById('outfitBadge');
    const outfitTitle = document.getElementById('outfitTitle');
    const outfitDesc = document.getElementById('outfitDesc');
    
    const weatherIcon = document.getElementById('weatherIcon');
    const tempValue = document.getElementById('tempValue');
    const weatherStatus = document.getElementById('weatherStatus');
    const feelsLike = document.getElementById('feelsLike');
    const humidity = document.getElementById('humidity');
    const wind = document.getElementById('wind');

    const tempInput = document.getElementById('tempInput');
    const conditionInput = document.getElementById('conditionInput');

    // 추천 로직 함수
    function updateRecommendation() {
      const currentTemp = parseInt(tempInput.value);
      const currentCondition = conditionInput.value;
      const condInfo = conditionConfig[currentCondition];

      // 1. 기온에 맞는 옷 추천 찾기
      const matchedOutfit = outfitData.find(item => currentTemp <= item.maxTemp);

      // 2. 옷 정보 업데이트
      outfitBadge.innerText = matchedOutfit.badge;
      outfitTitle.innerText = matchedOutfit.title;
      outfitDesc.innerText = matchedOutfit.desc + condInfo.extraDesc;

      // 3. 날씨 정보 업데이트
      tempValue.innerText = currentTemp;
      weatherIcon.className = `weather-icon fa-solid ${condInfo.icon}`;
      weatherIcon.style.color = condInfo.color;
      weatherStatus.innerText = `${condInfo.text} (서울 기준)`;
      
      feelsLike.innerText = `${currentTemp + (currentCondition === 'wind' ? -2 : 1)}°C`;
      humidity.innerText = currentCondition === 'rain' ? '85%' : '45%';
      wind.innerText = currentCondition === 'wind' ? '7.8m/s' : '2.1m/s';

      // 배경색 전환
      document.body.style.background = matchedOutfit.bg;

      // 애니메이션 연출
      resultArea.classList.add('show');
      outfitTitle.classList.remove('pulse');
      void outfitTitle.offsetWidth; // trigger reflow
      outfitTitle.classList.add('pulse');
    }

    // 버튼 클릭 이벤트
    recommendBtn.addEventListener('click', () => {
      updateRecommendation();
      // 버튼 클릭 후 자연스럽게 결과로 스크롤
      resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });

    // 슬라이더 및 선택창 변경 시 실시간 반영 (결과창이 열려있을 때)
    tempInput.addEventListener('input', () => {
      if (resultArea.classList.contains('show')) {
        updateRecommendation();
      }
    });

    conditionInput.addEventListener('change', () => {
      if (resultArea.classList.contains('show')) {
        updateRecommendation();
      }
    });
  </script>
</body>
</html>
